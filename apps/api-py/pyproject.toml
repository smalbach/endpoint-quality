[project]
name = "eq-api-py"
version = "0.1.0"
description = "Endpoint Quality — implementación de la API en FastAPI, sobre el mismo esquema que la de NestJS"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "asyncpg>=0.30",
    "pyjwt>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eq_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
