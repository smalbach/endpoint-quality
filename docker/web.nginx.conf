server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # A single-page app: every path that is not a file is the same document, and the router decides
  # from there. Without this, reloading /p/<id>/runs is a 404 from nginx.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The document that names the hashed bundle must be revalidated on every load. With no
  # Cache-Control the browser caches it heuristically, keeps pointing at the previous bundle, and a
  # rebuilt image does not reach an open browser.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # The API is proxied under the same origin so the refresh cookie stays same-site. SameSite=Strict
  # is what stops a cross-site request from spending it, and it only works if there is no cross
  # site involved.
  location /api/ {
    proxy_pass http://api:3001/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Server-sent events: no buffering, no timeout. A proxy that buffers text/event-stream turns
    # live progress into one burst at the end, which is the failure the polling fallback exists
    # for — better not to need it.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_http_version 1.1;
  }

  # Hashed filenames are immutable; index.html never is, or a deploy would not reach anybody.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
