server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # A single-page app: every path that is not a file is the same document, and the router decides
  # from there. Without this, reloading /p/<id>/runs is a 404 from nginx.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The document that names the hashed bundle must be revalidated on every load. With no
  # Cache-Control the browser caches it heuristically, keeps pointing at the previous bundle, and a
  # rebuilt image does not reach an open browser.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # La documentación publicada. Lo que la protege es que su URL no se adivine, y un buscador que la
  # indexe convierte eso en nada: deja de hacer falta adivinarla porque está en una lista. La
  # respuesta de la API lleva la misma cabecera; esta es para la página que ve el navegador.
  #
  # `rewrite ... break` y no `try_files`, y esto costó verlo en los bytes de una respuesta real:
  # `try_files` acaba en un salto interno a `location = /index.html`, y nginx **no** arrastra los
  # `add_header` de la location de origen — así que la cabecera se perdía y la única señal era que
  # la respuesta traía el `Cache-Control` del otro bloque. Con `break` el documento se sirve aquí
  # dentro, y por eso este bloque repite el `no-cache`: es el mismo motivo de allí, que el navegador
  # no se quede apuntando al paquete anterior.
  location ^~ /docs/ {
    add_header X-Robots-Tag "noindex, nofollow";
    add_header Cache-Control "no-cache";
    rewrite ^ /index.html break;
  }

  # The API is proxied under the same origin so the refresh cookie stays same-site. SameSite=Strict
  # is what stops a cross-site request from spending it, and it only works if there is no cross
  # site involved.
  location /api/ {
    proxy_pass http://api:3001/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Server-sent events: no buffering, no timeout. A proxy that buffers text/event-stream turns
    # live progress into one burst at the end, which is the failure the polling fallback exists
    # for — better not to need it.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_http_version 1.1;
  }

  # Las otras dos implementaciones de la misma API, bajo el **mismo origen** que la primera. Es lo
  # que permite que el selector del front cambie de backend sin que se caiga la sesión: la cookie de
  # refresco es `SameSite=Strict` y del origen, no del prefijo, así que los tres la reciben.
  #
  # Antes del bloque `/api/` no hace falta —nginx elige la location más larga que casa, no la
  # primera— pero sí importa que las tres sean prefijos distintos.
  location /api-py/ {
    proxy_pass http://api-py:3002/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_http_version 1.1;
  }

  location /api-go/ {
    proxy_pass http://api-go:3003/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_http_version 1.1;
  }

  # Hashed filenames are immutable; index.html never is, or a deploy would not reach anybody.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
