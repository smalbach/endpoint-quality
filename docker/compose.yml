# Todo el producto con un comando. `docker compose -f docker/compose.yml up`
#
# Redis es opcional: `QUEUE_DRIVER=memory` (el valor por defecto) ejecuta la cola en el propio
# proceso, que es lo que sostiene la promesa de "ejecutable en local sin infraestructura".
# Arranca con el perfil `redis` cuando quieras corridas concurrentes o que sobrevivan a un
# reinicio de la API.
name: endpoint-quality

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: eq
      POSTGRES_PASSWORD: eq
      POSTGRES_DB: endpoint_quality
    # Publicado para poder mirar la base con psql. Un puerto ocupado es lo más común que hay en
    # una máquina de desarrollo, así que todos los de aquí se pueden mover sin editar el fichero.
    ports: ["${EQ_POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `pg_isready` responde antes de que la base acepte conexiones de verdad; la consulta
      # comprueba lo que la API necesita, que es poder ejecutar SQL.
      test: ["CMD-SHELL", "psql -U eq -d endpoint_quality -c 'SELECT 1' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports: ["${EQ_REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # El esquema, como paso propio y con su propio código de salida.
  #
  # No `migrationsRun` al arrancar: eso ata "el esquema cambió" a "un proceso arrancó", cada
  # réplica de un despliegue lo intentaría, la API atendería peticiones con el DDL a medias, y una
  # migración que falla parecería un crash loop en vez de una migración fallida. Aquí `api` espera
  # a que termine bien, y si no termina bien no arranca nadie.
  migrate:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    command: ["node", "apps/api/dist/migrate.js"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://eq:eq@postgres:5432/endpoint_quality

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://eq:eq@postgres:5432/endpoint_quality
      QUEUE_DRIVER: ${QUEUE_DRIVER:-memory}
      # También el bus entre instancias: con varias réplicas detrás de un balanceador, el progreso en
      # vivo y las órdenes a una sesión de canal cruzan por aquí. Sin el perfil `redis` la API lo dice
      # una vez en el registro y sigue como una sola instancia.
      REDIS_URL: redis://redis:6379
      # Sin valor por defecto a propósito: la API se niega a arrancar sin ellos, en vez de
      # firmar con un secreto que está en un repositorio público.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?define JWT_ACCESS_SECRET en .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?define JWT_REFRESH_SECRET en .env}
      SECRETS_KEY: ${SECRETS_KEY:-}
      # El motor hace peticiones a URLs que escribe el usuario. En un despliegue alojado esto
      # tiene que seguir en false o la API alcanza la red interna: ver docs/decoupling-plan.md §4.8.
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
      RETENTION_BODIES_DAYS: ${RETENTION_BODIES_DAYS:-30}
      RETENTION_RUNS_DAYS: ${RETENTION_RUNS_DAYS:-365}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${EQ_WEB_PORT:-8080}}
      # El proxy de «Capturar tráfico». Vacío = apagado. Para encenderlo hay que definir el puerto
      # y publicarlo en `ports` (p. ej. "8888:8888"): no se publica aquí para no reservar un puerto
      # del anfitrión en las instalaciones que no lo usan.
      CAPTURE_PROXY_PORT: ${CAPTURE_PROXY_PORT:-}
      CAPTURE_PROXY_PUBLIC_HOST: ${CAPTURE_PROXY_PUBLIC_HOST:-localhost}
      # Puertos a los que abre túnel un CONNECT. Vacío = 443, 80 y 8443.
      CAPTURE_CONNECT_PORTS: ${CAPTURE_CONNECT_PORTS:-}
      # Descifrar HTTPS con una CA propia de la instalación. Apagado por omisión; exige SECRETS_KEY.
      CAPTURE_MITM: ${CAPTURE_MITM:-false}
      # El registro: una línea JSON por hecho a la salida estándar, que es de donde la recoge
      # `docker compose logs` y cualquier recolector. `LOG_LEVEL=debug` añade el healthcheck y el
      # detalle de depuración; `silent` no escribe nada.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports: ["${EQ_API_PORT:-3001}:3001"]
    # Sin esto, el fichero de registro del contenedor crece hasta llenar el disco de la máquina: el
    # driver por omisión de Docker no rota nada. Cien megas por servicio es el techo.
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    healthcheck:
      # `web` hace proxy de `/api/` contra esto, y el seed de la demo lo espera. Sin healthcheck,
      # `depends_on` solo dice "el contenedor arrancó", que no es lo mismo que "responde".
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  # --- las otras dos implementaciones del mismo contrato -----------------------------------------
  #
  # Mismo Postgres, mismo esquema y **los mismos secretos**: de ahí sale que una sesión abierta
  # contra `api` siga viva contra `api-py` o `api-go`, que es lo que el selector del front enseña.
  # Ninguna de las dos aplica migraciones; las dos esperan a que `migrate` termine bien.
  # Ver `docs/backends-poliglotas.md`.
  api-py:
    build:
      context: ..
      dockerfile: docker/api-py.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT_PY: 3002
      DATABASE_URL: postgres://eq:eq@postgres:5432/endpoint_quality
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?define JWT_ACCESS_SECRET en .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?define JWT_REFRESH_SECRET en .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${EQ_WEB_PORT:-8080}}
    ports: ["${EQ_API_PY_PORT:-3002}:3002"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3002/health').status==200 else 1)\""]
      interval: 3s
      timeout: 3s
      retries: 20

  api-go:
    build:
      context: ..
      dockerfile: docker/api-go.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT_GO: 3003
      DATABASE_URL: postgres://eq:eq@postgres:5432/endpoint_quality
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?define JWT_ACCESS_SECRET en .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?define JWT_REFRESH_SECRET en .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${EQ_WEB_PORT:-8080}}
    ports: ["${EQ_API_GO_PORT:-3003}:3003"]
    healthcheck:
      # La imagen es un binario y `ca-certificates`: nada con que hacer una petición. `nc` sobre el
      # puerto dice lo único que se puede decir desde dentro — que hay alguien escuchando.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3003 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    depends_on: [api, api-py, api-go]
    ports: ["${EQ_WEB_PORT:-8080}:8080"]

volumes:
  postgres-data:
